services:
  instrinder:
    build: .
    image: instrinder:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
    volumes:
      # SQLite DB, favicon cache, GeoIP file, logs, store reports
      - ./data:/app/data
    shm_size: "1gb"          # Chromium needs more than Docker's default 64 MB
    restart: unless-stopped
